repos:
  # General pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending

  # Black - Code formatting
  - repo: https://github.com/psf/black
    rev: 25.9.0
    hooks:
      - id: black
        language_version: python3
        args: [--line-length=88]

  # # isort - Import sorting
  # - repo: https://github.com/pycqa/isort
  #   rev: 5.13.2
  #   hooks:
  #     - id: isort
  #       args: [--profile=black, --line-length=88]
  #
  # isort stays off: ruff's "I" rules (already enabled below) cover import
  # sorting, so a separate isort hook would just duplicate/fight ruff.

  # Ruff - Fast Python linter (replaces flake8, pylint, etc.)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.2
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        # legacy/ was not part of the ruff cleanup this hook is being
        # switched on with (only cmbcov, tests,
        # examples and scripts were reviewed); exclude it here so
        # enabling the hook does not silently rewrite unreviewed code.
        exclude: ^legacy/
    # ruff-format is intentionally not enabled: black remains the formatter
    # (see [tool.black] in pyproject.toml); running both would fight.

  # # mypy - Static type checking (optional but recommended)
