[build-system]
requires = [
    "setuptools>=61",
    "wheel",
    "setuptools_scm[toml]>=8"
]
build-backend = "setuptools.build_meta"

[project]
name = "cmbcov"
dynamic = ["version"]
description = "Analytical covariance matrices for masked CMB power spectra: exact pseudo-Cl calculation and fast approximations."
authors = [
    { name = "Etienne Camphuis", email = "etienne.camphuis@iap.fr" }
]
readme = "README.md"
license = { text = "MIT License" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.23.2",
    "scipy>=1.9.2",
    "astropy>=5.2",
    "healpy>=1.16.2",
    "pyyaml>=6.0",
    "ducc0"
]
keywords = ["cosmology", "CMB", "power spectrum", "covariance", "pseudo-Cl", "MASTER", "PolSpice", "polarisation", "B modes", "HEALPix"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]

[project.urls]
Homepage = "https://github.com/ecamphuis/cmbcov"
Repository = "https://github.com/ecamphuis/cmbcov"
Documentation = "https://github.com/ecamphuis/cmbcov#readme"
Issues = "https://github.com/ecamphuis/cmbcov/issues"

[project.scripts]
compute-covariance = "cmbcov.scripts.compute_covariance:main"
cmbcov-cov = "cmbcov.scripts.compute_covariance:main"
validate-parameters = "cmbcov.scripts.validate_parameters:main"
convert-acc-cache = "cmbcov.scripts.convert_acc_cache:main"
precompute-acc = "cmbcov.scripts.precompute_acc:main"
cmbcov-precompute = "cmbcov.scripts.precompute_acc:main"

[project.optional-dependencies]
# Just what running the test suite needs (`pip install -e .[test]`, used by
# CI and by tools/export_public.sh's validation of the exported tree).
test = [
    "pytest>=6.0.0",
    "pytest-cov>=2.12.0",
    "sympy>=1.10"  # exact Wigner-3j reference for kernel regression tests
]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=2.12.0",
    "sympy>=1.10",  # exact Wigner-3j reference for kernel regression tests
    "black>=23.0.0",
    "ruff>=0.1.0",
    "isort>=5.12.0",
    "pre-commit>=3.0.0",
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=1.0.0"
]
plotting = [
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0"
]

[tool.setuptools.packages.find]
include = ["cmbcov*"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"

# Only v<version> tags are releases; checkpoint-* tags are not versions and
# would otherwise break version detection.
[tool.setuptools_scm.scm.git]
describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*"]

# Black configuration
[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # Exclude specific directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | legacy/fortran/covariance_tools
)/
'''

# isort configuration
[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
extend_skip_glob = ["legacy/fortran/covariance_tools/*"]

# Ruff configuration
[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["legacy/fortran/covariance_tools"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "B905",  # zip() without an explicit strict= parameter
    # N802/N803/N806: the package's names follow Camphuis et al. 2022
    # notation (M, G, K, Xi, C_l, W_l, Msq, Theta, ...); do not rename
    # physics symbols to satisfy naming conventions.
    "N802",  # function name should be lowercase
    "N803",  # argument name should be lowercase
    "N806",  # variable in function should be lowercase
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"examples/*" = ["N999"]   # Allow any name in examples
"scripts/*" = ["N999"]    # Allow any name in scripts

# mypy configuration
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start permissive, can be made stricter later
ignore_missing_imports = true
exclude = [
    "legacy/",
    "build/",
    "dist/"
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
