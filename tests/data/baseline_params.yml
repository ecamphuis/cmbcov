# Deterministic end-to-end baseline. Paths are rewritten by the test fixture.
cov_path: PLACEHOLDER_OUT
cov_name: covariance_matrix.dat
frequencies: ['090GHz', '150GHz']
stokes: ['T', 'E']
lmax: 60
lmin: 2
bins:
  - [2, 20, 6]
  - [20, 60, 10]
mask_name: baseline_mask.fits
mask_path: PLACEHOLDER_DATA
covariance_approximation: nka
beams:
  090GHz: 5.0
  150GHz: 2.0
pixwin: 32
cmb_spectrum: PLACEHOLDER_DATA/baseline_cls.dat
# White-noise levels in uK*arcmin, keyed by single frequency (form 1).
# Cross-frequency map noise is uncorrelated and so is zero by construction.
nl:
  090GHz: 20.0
  150GHz: 9.0
apodizetype: 1
apodizesigma: 30.0
thetamax: 30.0
Dl: True
